
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERP PixelLaunch</title>

    <!-- Sora Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: 'Sora', sans-serif;
            background: #10152B;
        }

        /* 3D Laptop */
        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: brightness(1.2) contrast(1.08);
        }

        /* Ambient Background Lighting */
        .atmosphere {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at 15% 55%,
                    rgba(94, 234, 212, 0.16),
                    transparent 45%
                ),

                radial-gradient(
                    ellipse at 85% 50%,
                    rgba(139, 92, 246, 0.20),
                    transparent 45%
                ),

                linear-gradient(
                    135deg,
                    rgba(15, 23, 42, 0.05),
                    rgba(30, 27, 75, 0.12)
                );

            mix-blend-mode: screen;
        }

        /* Hero Section */
        .hero {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            letter-spacing: -2px;

            background: linear-gradient(
                90deg,
                #8B5CF6,
                #5EEAD4,
                #FFFFFF,
                #8B5CF6
            );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            animation:
                gradientMove 8s linear infinite,
                floatText 5s ease-in-out infinite;
        }

        .hero p {
            margin-top: 15px;
            color: rgba(255,255,255,0.85);
            font-size: 18px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;

            animation: floatText 5s ease-in-out infinite;
        }

        /* Animations */
        @keyframes gradientMove {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        @keyframes floatText {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 14px;
            }

        }

    </style>

    <!-- Original 3D Model - DO NOT CHANGE -->
    <script type="module" src="./app.js"></script>

</head>

<body>

    <div class="atmosphere"></div>

    <section class="hero">

        <h1>ERP PixelLaunch</h1>

        <p>
            Websites that work as hard as you do.
        </p>

    </section>

</body>
</html>
